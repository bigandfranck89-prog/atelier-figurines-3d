<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171d">
<title>Validation catalogue — Atelier 3D</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Validation 3D">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1115;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:#14171d;border-bottom:1px solid #23262e;
         padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  header h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
  #btn-install{margin-left:auto;background:#1b1f27;border:1px solid #2a2f3a;border-radius:10px;
               font-size:17px;padding:5px 10px;cursor:pointer;line-height:1}
  header p{margin:4px 0 0;color:#8b98a5;font-size:12.5px;line-height:1.4}
  .filtres{display:flex;gap:6px;margin-top:10px}
  .filtres button{flex:1;background:#1b1f27;border:1px solid #2a2f3a;color:#9aa0a6;border-radius:999px;
                  padding:8px 4px;font-size:12.5px;font-weight:600;cursor:pointer}
  .filtres button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  .cpt{padding:12px 14px 2px;color:#8b98a5;font-size:13px}
  .cpt b{color:#e6edf3}
  .liste{padding:8px 12px 10px;display:flex;flex-direction:column;gap:14px}
  .card{background:#161b26;border:1px solid #2a2f3a;border-radius:16px;overflow:hidden}
  .vign{position:relative;background:#0f1115;min-height:170px;display:flex;align-items:center;justify-content:center}
  .vign img{width:100%;display:block;max-height:300px;object-fit:contain}
  .att{padding:24px 14px;text-align:center;color:#8b98a5;font-size:13px;line-height:1.5}
  .att .pt{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ea6ff;margin:0 2px;
           animation:cl 1.2s infinite ease-in-out}
  .att .pt:nth-child(2){animation-delay:.2s} .att .pt:nth-child(3){animation-delay:.4s}
  @keyframes cl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .rimg{background:#242a35;color:#c3ccd8;border:0;border-radius:10px;padding:9px 16px;font-size:13px;
        font-weight:600;cursor:pointer;margin-top:8px}
  .corps{padding:12px 14px 14px}
  .nom{font-size:16px;font-weight:700;margin:0 0 2px}
  .cat{color:#7ea6ff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .desc{color:#c3ccd8;font-size:13.5px;line-height:1.5;margin:8px 0 0}
  .sol{margin-top:10px;background:#131a17;border:1px solid #24463a;border-radius:10px;
       padding:9px 11px;color:#9fd8bf;font-size:12.5px;line-height:1.45}
  .ep{margin-top:8px;font-size:12.5px}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1;border:0;border-radius:12px;padding:14px 6px;font-size:15px;font-weight:700;cursor:pointer}
  .oui{background:#15803d;color:#fff}
  .non{background:#242a35;color:#c3ccd8}
  .etat{padding:10px 14px;font-size:13.5px;font-weight:600;border-bottom:1px solid #2a2f3a}
  .etat.g{color:#5be3a5;background:#12211a}
  .etat.r{color:#9aa0a6;background:#1a1d24}
  .annul{background:none;border:0;color:#7ea6ff;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0 0 0 8px}
  .vide,.err{padding:34px 18px;text-align:center;color:#8b98a5;font-size:14px;line-height:1.6}
  .err{color:#ff9aa4}
  .rbtn{display:inline-block;margin-top:14px;background:#1d4ed8;color:#fff;border:0;border-radius:12px;
        padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .suite{margin:0 12px 26px}
  .suite button{width:100%;background:#1b1f27;border:1px solid #2a2f3a;color:#dbe4ff;border-radius:14px;
                padding:15px;font-size:14.5px;font-weight:700;cursor:pointer}
  .fade{opacity:.5}
  #install{display:none;margin:10px 12px 0;background:#12211a;border:1px solid #24463a;border-radius:14px;
           padding:12px 14px;font-size:13px;color:#9fd8bf;line-height:1.5}
  #install b{color:#e6edf3}
  #install button.go{margin-top:10px;background:#15803d;color:#fff;border:0;border-radius:10px;
                     padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}
  #install .x{float:right;background:none;border:0;color:#8b98a5;font-size:18px;padding:0;margin:0;cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>🗳️ Validation du catalogue
    <button id="btn-install" onclick="aideInstall()" title="Ajouter à l'écran d'accueil">📲</button></h1>
  <p>Les propositions du jour. <b>Garder</b> les envoie au catalogue vendable, <b>Rejeter</b> les écarte.
     Aucune sculpture 3D n'est lancée sans ton feu vert.</p>
  <div class="filtres">
    <button id="f-propose" class="on" onclick="voir('propose')">⏳ En attente</button>
    <button id="f-garde" onclick="voir('garde')">✅ Gardées</button>
    <button id="f-rejete" onclick="voir('rejete')">✖️ Rejetées</button>
  </div>
</header>

<div id="install"></div>
<div class="cpt" id="cpt"></div>
<div class="liste" id="liste"></div>
<div class="suite" id="suite"></div>

<script>
(function () {
  "use strict";
  var SUPA = "https://bmvytqfddrfgcgokoxfn.supabase.co";
  var KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdnl0cWZkZHJmZ2Nnb2tveGZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3Njk3NDgsImV4cCI6MjA5MjM0NTc0OH0.Bcy6o77bQHaM8e8yDjMgRuLP5Tr2dxAmnliUITMGGas";
  var H = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };

  var PAR_PAGE = 12;          // on n'affiche pas 91 cartes d'un coup
  var IMG_PARALLELE = 2;      // Pollinations fabrique chaque image a la demande :
  var IMG_TIMEOUT = 30000;    // au-dela de 2 en meme temps, il ignore les suivantes.
                              // 30 s : au-dela on rend la main plutot que de bloquer la file.

  var LIB = {
    propose: { un: "en attente de ton choix", plus: "en attente de ton choix" },
    garde:   { un: "gardée",  plus: "gardées"  },
    rejete:  { un: "rejetée", plus: "rejetées" }
  };
  var statutCourant = "propose";
  var toutes = [];      // toutes les lignes recues
  var affichees = 0;    // combien sont deja dans la page

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function phraseCompteur() {
    var n = toutes.length, m = LIB[statutCourant];
    var t = "<b>" + n + "</b> proposition" + (n > 1 ? "s " : " ") + (n > 1 ? m.plus : m.un) + ".";
    if (n > affichees) t += " <span style=\"color:#7ea6ff\">" + affichees + " affichée" + (affichees > 1 ? "s" : "") + ".</span>";
    return t;
  }

  function verdictEp(mm) {
    mm = Number(mm);
    if (mm >= 3)   return '<span style="color:#5be3a5">✅ Mesuré sur le fichier 3D : ' + mm.toFixed(1) + ' mm (≥ 3 mm partout).</span>';
    if (mm >= 1.5) return '<span style="color:#ffcf7a">🟠 Mesuré : ' + mm.toFixed(1) + ' mm — fragile, à épaissir.</span>';
    return '<span style="color:#ff9aa4">🔴 Mesuré : ' + mm.toFixed(1) + ' mm — casserait, à corriger.</span>';
  }

  // ---------- file d'attente des apercus ----------
  // Chaque image est generee a la demande (plusieurs secondes). On en demande
  // 2 a la fois : au-dela, le service laisse tomber les requetes en trop.
  var file = [], enCours = 0;

  function allegerUrl(u) {
    // 768 px inutile sur un telephone, et 2x plus long a fabriquer
    return String(u).replace(/([?&])width=\d+/, "$1width=512").replace(/([?&])height=\d+/, "$1height=512");
  }

  function enfiler(id, url) { file.push({ id: id, url: url }); pomper(); }

  function pomper() {
    while (enCours < IMG_PARALLELE && file.length) {
      var t = file.shift();
      if (!$("v" + t.id)) continue;   // carte plus a l'ecran
      enCours++;
      charger1(t.id, t.url);
    }
  }

  // horsFile = relance manuelle : elle ne doit pas attendre derriere la file,
  // sinon le bouton "Reessayer" a l'air de ne rien faire pendant 30 s.
  function charger1(id, url, horsFile) {
    var zone = $("v" + id);
    if (!zone) { if (!horsFile) { enCours--; pomper(); } return; }
    var fini = false;
    var img = new Image();
    function libere() { if (!horsFile) { enCours--; pomper(); } }

    var minuteur = setTimeout(function () {
      if (fini) return;
      fini = true; img.src = "";
      echec(id, url, "L'aperçu met trop de temps à se fabriquer.");
      libere();
    }, IMG_TIMEOUT);

    img.onload = function () {
      if (fini) return;
      fini = true; clearTimeout(minuteur);
      var z = $("v" + id);
      if (z) { z.innerHTML = ""; z.appendChild(img); }
      libere();
    };
    img.onerror = function () {
      if (fini) return;
      fini = true; clearTimeout(minuteur);
      // un echec vient souvent d'une fabrication abandonnee : on retente une
      // fois tout seul avec un autre grain avant d'embeter Franck.
      if (!horsFile && !dejaRetente[id]) {
        dejaRetente[id] = 1;
        var u2 = nouveauGrain(url);
        setTimeout(function () { charger1(id, u2, true); }, 600);
        libere();
        return;
      }
      echec(id, url, "L'aperçu n'a pas pu être fabriqué.");
      libere();
    };
    img.alt = "";
    img.src = url;
  }

  var dejaRetente = {};

  function nouveauGrain(url) {
    return String(url).replace(/([?&])seed=\d+/, "$1seed=" + Math.floor(Math.random() * 999999));
  }

  function echec(id, url, msg) {
    var z = $("v" + id);
    if (!z) return;
    z.setAttribute("data-url", url);
    z.innerHTML = '<div class="att">🖼️ ' + esc(msg) + '<br>Tu peux décider avec le texte.' +
      '<br><button class="rimg" onclick="relancerImg(' + id + ')">🔄 Réessayer l\'aperçu</button></div>';
  }

  window.relancerImg = function (id) {
    var z = $("v" + id); if (!z) return;
    var url = z.getAttribute("data-url");
    if (!url) return;
    z.innerHTML = '<div class="att">Aperçu en préparation<span class="pt"></span><span class="pt"></span><span class="pt"></span></div>';
    // relance immediate, sans passer par la file : Franck a demande celle-ci
    charger1(id, nouveauGrain(url), true);
  };

  // ---------- chargement des propositions ----------
  window.voir = function (statut) {
    statutCourant = statut;
    ["propose", "garde", "rejete"].forEach(function (s) {
      $("f-" + s).className = (s === statut) ? "on" : "";
    });
    charger();
  };

  function charger() {
    file = []; enCours = 0; toutes = []; affichees = 0; dejaRetente = {};
    $("suite").innerHTML = "";
    $("cpt").textContent = "";
    $("liste").innerHTML = '<div class="vide">Chargement…</div>';
    fetch(SUPA + "/rest/v1/catalogue_propositions?statut=eq." + statutCourant + "&order=cree_le.desc&limit=500",
          { headers: H })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (rows) {
        toutes = Array.isArray(rows) ? rows : [];
        if (!toutes.length) {
          $("liste").innerHTML = '<div class="vide">Rien ici pour l\'instant.<br>' +
            (statutCourant === "propose"
              ? "Les nouvelles propositions arrivent chaque jour automatiquement."
              : "Tes décisions apparaîtront ici.") + '</div>';
          return;
        }
        $("liste").innerHTML = "";
        ajouterPage();
      })
      .catch(function () {
        $("cpt").textContent = "";
        $("liste").innerHTML = '<div class="err">Impossible de charger les propositions.<br>Vérifie ta connexion.' +
          '<br><button class="rbtn" onclick="rafraichir()">Réessayer</button></div>';
      });
  }
  window.rafraichir = charger;

  function ajouterPage() {
    var lot = toutes.slice(affichees, affichees + PAR_PAGE);
    var html = lot.map(carte).join("");
    $("liste").insertAdjacentHTML("beforeend", html);
    lot.forEach(function (p) { if (p.image_url) enfiler(p.id, allegerUrl(p.image_url)); });
    affichees += lot.length;
    $("cpt").innerHTML = phraseCompteur();
    var reste = toutes.length - affichees;
    $("suite").innerHTML = reste > 0
      ? '<button onclick="pageSuivante()">Voir les ' + Math.min(PAR_PAGE, reste) + ' suivantes (' + reste + ' restantes)</button>'
      : '';
  }
  window.pageSuivante = ajouterPage;

  function carte(p) {
    var vign = p.image_url
      ? '<div class="vign" id="v' + p.id + '"><div class="att">Aperçu en préparation' +
        '<span class="pt"></span><span class="pt"></span><span class="pt"></span></div></div>'
      : '';
    var boutons = (statutCourant === "propose")
      ? '<div class="actions">' +
          '<button class="oui" onclick="decider(' + p.id + ',\'garde\')">✅ Garder</button>' +
          '<button class="non" onclick="decider(' + p.id + ',\'rejete\')">✖️ Rejeter</button>' +
        '</div>'
      : '<div class="actions"><button class="non" onclick="decider(' + p.id + ',\'propose\')">↩︎ Remettre en attente</button></div>';
    return '<div class="card" id="p' + p.id + '">' +
      '<div id="e' + p.id + '"></div>' + vign +
      '<div class="corps">' +
        '<div class="cat">' + esc(p.categorie || "—") + '</div>' +
        '<h2 class="nom">' + esc(p.nom || "Sans nom") + '</h2>' +
        '<p class="desc">' + esc(p.description || "") + '</p>' +
        (p.regles_solidite ? '<div class="sol">🛡️ ' + esc(p.regles_solidite) + '</div>' : '') +
        '<div class="ep">' + (p.epaisseur_min_mm != null
            ? verdictEp(p.epaisseur_min_mm)
            : '<span style="color:#8b98a5">📏 Épaisseur pas encore mesurée (pas de fichier 3D).</span>') + '</div>' +
        boutons +
      '</div></div>';
  }

  window.decider = function (id, decision) {
    var carteEl = $("p" + id), etat = $("e" + id);
    etat.innerHTML = '<div class="etat r">Enregistrement…</div>';
    fetch(SUPA + "/rest/v1/catalogue_propositions?id=eq." + id, {
      method: "PATCH",
      headers: Object.assign({}, H, { Prefer: "return=minimal" }),
      body: JSON.stringify({ statut: decision, decide_le: new Date().toISOString() })
    })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (decision === "propose") { charger(); return; }
      carteEl.className = "card fade";
      etat.innerHTML = '<div class="etat ' + (decision === "garde" ? "g" : "r") + '">' +
        (decision === "garde" ? "✅ Gardée — elle part au catalogue." : "✖️ Rejetée.") +
        '<button class="annul" onclick="decider(' + id + ',\'propose\')">annuler</button></div>';
      // la proposition ne compte plus dans le lot en attente
      for (var i = 0; i < toutes.length; i++) {
        if (toutes[i].id === id) { toutes.splice(i, 1); affichees--; break; }
      }
      $("cpt").innerHTML = phraseCompteur();
    })
    .catch(function () {
      // ne jamais laisser croire que c'est enregistré
      etat.innerHTML = '<div class="etat" style="color:#ff9aa4;background:#241a1d">' +
        '⚠️ Pas enregistré (connexion ?). Réessaie.</div>';
    });
  };

  // ---------- Ajouter a l'ecran d'accueil ----------
  var promptDiffere = null;
  var deja = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var banniereMontree = false;
  var estIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Une version precedente memorisait la fermeture du bandeau pour toujours :
  // une croix cliquee par megarde le faisait disparaitre definitivement. On
  // efface cette memoire, et la fermeture ne vaut plus que pour la visite.
  try { localStorage.removeItem("install_masque"); } catch (e) {}

  function masquerInstall() { $("install").style.display = "none"; }
  window.masquerInstall = masquerInstall;

  function afficherInstall(html, force) {
    if (deja && !force) return;
    if (banniereMontree && !force) return;
    banniereMontree = true;
    var d = $("install");
    d.innerHTML = '<button class="x" onclick="masquerInstall()" aria-label="Fermer">✕</button>' + html;
    d.style.display = "block";
    if (force) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function texteAide() {
    if (estIOS) {
      return '<b>Mettre cette page sur ton écran d\'accueil</b><br>' +
        'Appuie sur <b>Partager</b> en bas de Safari (le carré avec une flèche vers le haut), ' +
        'puis fais défiler et choisis <b>« Sur l\'écran d\'accueil »</b>.';
    }
    return '<b>Mettre cette page sur ton écran d\'accueil</b><br>' +
      'Ouvre le menu de ton navigateur (les <b>⋮</b> en haut à droite, ou <b>Aa</b> selon le navigateur), ' +
      'puis choisis <b>« Ajouter à l\'écran d\'accueil »</b> ou <b>« Installer l\'application »</b>.<br>' +
      'Si tu ne vois pas le menu, fais glisser la page vers le bas : la barre du navigateur réapparaît.';
  }

  // Bouton 📲 de l'en-tete : toujours disponible, quoi qu'il arrive.
  window.aideInstall = function () {
    if (deja) {
      afficherInstall('<b>C\'est déjà fait 👍</b><br>Tu utilises la version installée sur ton écran d\'accueil.', true);
      return;
    }
    if (promptDiffere) {
      afficherInstall('<b>Mettre cette page sur ton écran d\'accueil ?</b><br>' +
        'Tu l\'ouvriras ensuite comme une application, sans taper l\'adresse.' +
        '<br><button class="go" onclick="installer()">📲 Ajouter à l\'écran d\'accueil</button>', true);
      return;
    }
    afficherInstall(texteAide(), true);
  };

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    promptDiffere = e;
    banniereMontree = false;   // le vrai bouton remplace le mode d'emploi
    afficherInstall('<b>Mettre cette page sur ton écran d\'accueil ?</b><br>' +
      'Tu l\'ouvriras ensuite comme une application, sans taper l\'adresse.' +
      '<br><button class="go" onclick="installer()">📲 Ajouter à l\'écran d\'accueil</button>');
  });

  window.installer = function () {
    if (!promptDiffere) return;
    promptDiffere.prompt();
    promptDiffere.userChoice.then(function () { promptDiffere = null; masquerInstall(); });
  };
  window.addEventListener("appinstalled", masquerInstall);

  // Mode d'emploi de secours : si le navigateur ne propose pas de bouton
  // (iPhone, ou Chrome qui n'a pas encore juge la page installable), on
  // explique le geste exact au lieu de ne rien afficher du tout.
  setTimeout(function () {
    if (promptDiffere || deja) return;
    afficherInstall(texteAide());
  }, 2500);

  // Service worker PROPRE a ce dossier (/validation/). Il ne touche jamais a
  // l'app cliente : portee separee, cache separe, aucun effacement global.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});

  charger();
})();
</script>
</body>
</html>
