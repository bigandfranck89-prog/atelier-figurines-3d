<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16120C">
<title>Suivi Marvel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16120C; --panel:#221C14; --panel-2:#2C241A;
    --amber:#F0A828; --amber-dim:#8C6320;
    --cream:#E9DFC9; --cream-dim:#9C917C;
    --olive:#7A8459; --rust:#C2452D; --line:#3A3025;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 18% 8%, rgba(240,168,40,.07), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    color:var(--cream);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    line-height:1.5; padding:20px 14px 70px;
  }
  .wrap{max-width:840px;margin:0 auto}
  header{border:1px solid var(--line);border-top:3px solid var(--amber);
    background:var(--panel);padding:20px 18px 16px}
  .eyebrow{font-family:"Space Mono",monospace;font-size:10px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--amber-dim)}
  h1{font-family:"Anton",Impact,sans-serif;font-size:clamp(30px,8vw,48px);
    letter-spacing:.02em;line-height:.95;text-transform:uppercase;margin:6px 0 2px}
  h1 em{font-style:normal;color:var(--amber)}
  .sub{font-size:13px;color:var(--cream-dim);max-width:52ch}

  .gauge{margin-top:18px}
  .gauge-top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--cream-dim);margin-bottom:6px}
  .gauge-top b{color:var(--amber);font-size:15px}
  .bar{height:12px;background:var(--ink);border:1px solid var(--line);
    display:flex;gap:1px;padding:2px}
  .tick{flex:1;background:#2A2318;transition:background .25s ease}
  .tick.on{background:var(--amber)} .tick.half{background:var(--olive)}
  @media (prefers-reduced-motion:reduce){.tick{transition:none}}

  .tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:1px solid var(--line)}
  .tab{font-family:"Anton",Impact,sans-serif;font-size:14px;letter-spacing:.08em;
    text-transform:uppercase;background:transparent;border:0;
    color:var(--cream-dim);padding:9px 14px;cursor:pointer;
    border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0}
  .chip{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;background:transparent;color:var(--cream-dim);
    border:1px solid var(--line);padding:6px 11px;cursor:pointer}
  .chip:hover{border-color:var(--amber-dim);color:var(--cream)}
  .chip[aria-pressed="true"]{background:var(--amber);color:var(--ink);
    border-color:var(--amber);font-weight:700}
  .chip:focus-visible,.tab:focus-visible,.status:focus-visible{
    outline:2px solid var(--amber);outline-offset:2px}

  section{margin-top:32px}
  .sec-head{display:flex;align-items:baseline;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:7px}
  .sec-head h2{font-family:"Anton",Impact,sans-serif;font-size:18px;
    text-transform:uppercase;letter-spacing:.06em;font-weight:400}
  .sec-head span{font-family:"Space Mono",monospace;font-size:10px;
    color:var(--cream-dim);letter-spacing:.1em;margin-left:auto;white-space:nowrap}
  .sec-note{font-size:12px;color:var(--cream-dim);margin:8px 0 10px}

  .row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    padding:11px 12px;margin-top:6px;position:relative}
  .row.vu{border-left-color:var(--amber);background:var(--panel-2)}
  .row.vu .title{color:var(--cream-dim);text-decoration:line-through;
    text-decoration-color:var(--amber-dim)}
  .row.cours{border-left-color:var(--olive)}
  .row.futur{border-left-color:var(--rust);border-style:dashed}
  .row.prio::after{content:"PRIORITÉ";position:absolute;top:-1px;right:-1px;
    font-family:"Space Mono",monospace;font-size:8px;letter-spacing:.14em;
    background:var(--rust);color:#fff;padding:2px 6px}
  .row.prio.vu::after,.row.futur.prio::after{display:none}
  .year{font-family:"Space Mono",monospace;font-size:12px;color:var(--amber-dim)}
  .title{font-weight:600;font-size:15px;line-height:1.25}
  .meta{font-family:"Space Mono",monospace;font-size:10.5px;
    color:var(--cream-dim);letter-spacing:.04em;margin-top:3px}
  .tag{display:inline-block;border:1px solid var(--line);padding:0 4px;
    margin-left:6px;color:var(--olive);font-size:10px;
    font-family:"Space Mono",monospace;text-transform:uppercase;vertical-align:middle}
  .tag.anim{color:var(--amber-dim);border-color:var(--amber-dim)}
  .tag.film{color:var(--cream);border-color:var(--cream-dim)}
  .note{font-size:12px;color:var(--cream-dim);margin-top:5px;max-width:56ch}
  .compte{color:var(--rust);font-weight:600;font-size:12px;margin-top:5px;
    font-family:"Space Mono",monospace}

  .status{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:700;width:78px;min-height:44px;
    background:transparent;border:1px dashed var(--line);color:var(--cream-dim);
    cursor:pointer;padding:4px}
  .status:hover{border-color:var(--amber-dim);color:var(--cream)}
  .status[data-s="vu"]{border:2px solid var(--amber);border-style:solid;
    color:var(--amber);transform:rotate(-6deg)}
  .status[data-s="cours"]{border-style:solid;border-color:var(--olive);color:var(--olive)}
  .status[disabled]{opacity:.5;cursor:default;border-color:var(--rust);color:var(--rust)}
  @media (prefers-reduced-motion:reduce){.status[data-s="vu"]{transform:none}}

  .ere{font-family:"Anton",Impact,sans-serif;font-size:15px;color:var(--amber);
    letter-spacing:.1em;text-transform:uppercase;margin:22px 0 4px;
    padding-left:10px;border-left:3px solid var(--amber)}
  .chrono-note{font-size:12px;color:var(--cream-dim);margin:10px 0 0}

  footer{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap;font-family:"Space Mono",monospace;font-size:10.5px;
    color:var(--cream-dim);letter-spacing:.06em}
  .reset{background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:7px 12px;cursor:pointer}
  .reset:hover{border-color:var(--rust);color:var(--rust)}
  .saving{color:var(--amber);opacity:0} .saving.on{opacity:1}
  .erreur{border:1px solid var(--rust);padding:14px;margin-top:20px;font-size:13px}

  @media(max-width:520px){
    .row{grid-template-columns:48px 1fr;grid-template-areas:"y t" ". s"}
    .year{grid-area:y}.cell{grid-area:t}
    .status{grid-area:s;justify-self:start;margin-top:4px}
    .tab{padding:9px 10px;font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">Dossier de visionnage · films et séries</div>
  <h1>Suivi <em>Marvel</em></h1>
  <p class="sub">Touchez la case de droite pour faire tourner le statut : à voir → en cours → vu. Les titres pas encore sortis basculent tout seuls le jour de leur sortie.</p>

  <div class="gauge">
    <div class="gauge-top">
      <span>Avancement</span>
      <span><b id="count">0</b> / <span id="total">0</span> vus</span>
    </div>
    <div class="bar" id="bar"></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" data-v="liste" role="tab" aria-selected="true">Liste</button>
    <button class="tab" data-v="venir" role="tab" aria-selected="false">À venir</button>
    <button class="tab" data-v="chrono" role="tab" aria-selected="false">Chronologie</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip" data-f="all" aria-pressed="true">Tout</button>
    <button class="chip" data-f="todo" aria-pressed="false">À voir</button>
    <button class="chip" data-f="done" aria-pressed="false">Déjà vus</button>
    <button class="chip" data-f="films" aria-pressed="false">Films seuls</button>
    <button class="chip" data-f="noanim" aria-pressed="false">Sans animation</button>
  </div>
</header>

<div id="app"></div>

<footer>
  <span>Données mises à jour le <span id="maj">…</span> <span class="saving" id="saving">● enregistré</span></span>
  <button class="reset" id="reset">Tout remettre à zéro</button>
</footer>

</div>

<script>
const KEY = "marvel-tracker-franck";
const GROUPES = {
  film:      ["Films hors continuité", "Films non rattachés au fil principal de l'histoire."],
  serie:     ["Séries en marge de la saga", "Rattachées au MCU mais pas indispensables au fil principal."],
  special:   ["Formats courts et spéciaux", "Une soirée chacun."],
  netflix:   ["L'ère Netflix et Marvel Television", "Continuité à part, mais Daredevil et Le Punisher alimentent Born Again."],
  mutants:   ["Mutants et hors-MCU", "Produites par la Fox, continuité séparée."],
  anim:      ["Animation", "Le filtre « Sans animation » masque ce bloc."],
  classique: ["Les classiques d'animation", "Le catalogue Disney+ bouge, certains vont et viennent."],
  doc:       ["Documentaires et coulisses", "Légendes est pratique : 10 minutes pour se remettre un personnage en tête."]
};
const ORDRE = ["film","serie","special","netflix","mutants","anim","classique","doc"];
const ANIMES = ["anim","classique"];

let DATA = [], state = {}, vue = "liste", filtre = "all";
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const savingEl = document.getElementById("saving");
const AUJ = new Date(); AUJ.setHours(0,0,0,0);

function futur(i){ return i.d && new Date(i.d) > AUJ; }
function statut(i){ return futur(i) ? "futur" : (state[i.t] || "todo"); }
function fdate(s){
  const d = new Date(s);
  return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
}
function jours(s){
  return Math.ceil((new Date(s) - AUJ) / 86400000);
}

function visible(i){
  const s = statut(i);
  if (filtre === "todo")   return s === "todo" || s === "cours";
  if (filtre === "done")   return s === "vu";
  if (filtre === "films")  return i.k === "film";
  if (filtre === "noanim") return !ANIMES.includes(i.k);
  return true;
}

function ligne(i, montrerDate){
  const s = statut(i);
  const est = s === "futur";
  const row = document.createElement("div");
  row.className = "row" + (s==="vu"?" vu":s==="cours"?" cours":est?" futur":"")
                + (i.p && s==="todo" ? " prio" : "");
  const label = s==="vu"?"Vu":s==="cours"?"En cours":est?"À venir":"À voir";
  const tag = i.k==="film" ? '<span class="tag film">film</span>'
            : i.k==="special" ? '<span class="tag">spécial</span>'
            : ANIMES.includes(i.k) ? '<span class="tag anim">animé</span>'
            : '<span class="tag">série</span>';
  const an = i.d ? i.d.slice(0,4) : "";

  row.innerHTML =
    '<div class="year">' + (montrerDate && i.e ? i.e : an) + '</div>' +
    '<div class="cell"><div class="title">' + i.t + tag + '</div>' +
    '<div class="meta">' + (i.m||"") + (i.d ? " · " + fdate(i.d) : "") + '</div>' +
    (i.n ? '<div class="note">' + i.n + '</div>' : '') +
    (est ? '<div class="compte">Dans ' + jours(i.d) + ' jour' + (jours(i.d)>1?"s":"") + '</div>' : '') +
    '</div>' +
    '<button class="status" data-s="' + s + '"' + (est ? ' disabled' : '') +
      ' aria-label="Statut de ' + i.t + ' : ' + label + '">' + label + '</button>';

  if (!est) row.querySelector(".status").addEventListener("click", () => {
    const c = state[i.t] || "todo";
    state[i.t] = c==="todo" ? "cours" : c==="cours" ? "vu" : "todo";
    save(); rendre();
  });
  return row;
}

function vueListe(){
  // 1. La saga principale, dans l'ordre de l'histoire (films, séries et
  //    spéciaux mélangés : chaque série est placée là où elle se regarde).
  const saga = DATA.filter(i => i.c !== undefined && visible(i))
                   .sort((a,b) => a.c - b.c);
  if (saga.length){
    const el = document.createElement("section");
    const vus = saga.filter(i => statut(i) === "vu").length;
    el.innerHTML = '<div class="sec-head"><h2>L\'histoire dans l\'ordre</h2>' +
                   '<span>' + vus + '/' + saga.length + '</span></div>' +
                   '<p class="sec-note">Films, séries et spéciaux mélangés, dans l\'ordre des événements de l\'histoire (pas l\'ordre de sortie). Chaque série apparaît à sa place, entre les deux films qu\'elle relie.</p>';
    let ere = null;
    saga.forEach(i => {
      if (i.e && i.e !== ere){
        ere = i.e;
        const h = document.createElement("div");
        h.className = "ere"; h.textContent = ere;
        el.appendChild(h);
      }
      el.appendChild(ligne(i, false));
    });
    app.appendChild(el);
  }
  // 2. Le reste (Netflix, mutants, animation, classiques, docs…) : hors
  //    continuité principale, toujours groupé par famille.
  ORDRE.forEach(k => {
    const items = DATA.filter(i => i.c === undefined && i.k === k && visible(i));
    if (!items.length) return;
    const el = document.createElement("section");
    const vus = items.filter(i => statut(i) === "vu").length;
    el.innerHTML = '<div class="sec-head"><h2>' + GROUPES[k][0] + '</h2>' +
                   '<span>' + vus + '/' + items.length + '</span></div>' +
                   '<p class="sec-note">' + GROUPES[k][1] + '</p>';
    items.forEach(i => el.appendChild(ligne(i, false)));
    app.appendChild(el);
  });
}

function vueVenir(){
  const items = DATA.filter(i => futur(i)).sort((a,b) => a.d.localeCompare(b.d));
  const el = document.createElement("section");
  el.innerHTML = '<div class="sec-head"><h2>Sorties annoncées</h2>' +
                 '<span>' + items.length + ' à venir</span></div>' +
                 '<p class="sec-note">Chaque titre bascule automatiquement dans « À voir » le jour de sa sortie. Les dates Marvel bougent souvent : elles sont mises à jour avec le fichier de données.</p>';
  if (!items.length) el.innerHTML += '<p class="note">Rien d\'annoncé pour le moment.</p>';
  items.forEach(i => el.appendChild(ligne(i, false)));
  app.appendChild(el);
}

function vueChrono(){
  const items = DATA.filter(i => i.c !== undefined && visible(i))
                    .sort((a,b) => a.c - b.c);
  const el = document.createElement("section");
  el.innerHTML = '<div class="sec-head"><h2>Ordre de l\'histoire</h2>' +
                 '<span>' + items.length + ' titres</span></div>' +
                 '<p class="sec-note">Non pas l\'ordre de sortie, mais celui des événements. Seuls les titres rattachés à la continuité principale y figurent — les séries Netflix, les mutants Fox et l\'animation en sont exclus.</p>';
  let ere = null;
  items.forEach(i => {
    if (i.e && i.e !== ere){
      ere = i.e;
      const h = document.createElement("div");
      h.className = "ere"; h.textContent = ere;
      el.appendChild(h);
    }
    el.appendChild(ligne(i, false));
  });
  const p = document.createElement("p");
  p.className = "chrono-note";
  p.textContent = "L'année indiquée est celle admise par la majorité des chronologies publiées ; Marvel n'a jamais officialisé de datation complète.";
  el.appendChild(p);
  app.appendChild(el);
}

function jauge(){
  const cibles = DATA.filter(i => !futur(i));
  const vus = cibles.filter(i => state[i.t]==="vu").length;
  const cours = cibles.filter(i => state[i.t]==="cours").length;
  document.getElementById("count").textContent = vus;
  document.getElementById("total").textContent = cibles.length;
  bar.innerHTML = "";
  for (let k=0; k<cibles.length; k++){
    const t = document.createElement("div");
    t.className = "tick" + (k<vus ? " on" : k<vus+cours ? " half" : "");
    bar.appendChild(t);
  }
}

function rendre(){
  app.innerHTML = "";
  if (vue === "liste") vueListe();
  else if (vue === "venir") vueVenir();
  else vueChrono();
  document.getElementById("filters").style.display = vue==="venir" ? "none" : "flex";
  jauge();
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  vue = t.dataset.v;
  document.querySelectorAll(".tab").forEach(x =>
    x.setAttribute("aria-selected", x===t ? "true" : "false"));
  rendre();
}));

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filtre = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x =>
    x.setAttribute("aria-pressed", x===c ? "true" : "false"));
  rendre();
}));

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Effacer toute la progression ?")) { state = {}; save(); rendre(); }
});

let saveTimer;
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    savingEl.classList.add("on");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => savingEl.classList.remove("on"), 1400);
  } catch(e){
    savingEl.textContent = "● sauvegarde impossible";
    savingEl.classList.add("on");
  }
}

async function demarrer(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e){ state = {}; }

  try {
    const r = await fetch("data.json?" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    DATA = j.items;
    document.getElementById("maj").textContent = fdate(j.maj);
  } catch(e){
    app.innerHTML = '<div class="erreur">Impossible de charger les données ' +
      '(fichier data.json introuvable ou hors ligne). Rechargez la page une fois ' +
      'la connexion revenue.</div>';
    return;
  }

  if (!Object.keys(state).length){
    state = { "WandaVision":"vu", "Falcon et le Soldat de l'Hiver":"vu" };
    save();
  }
  rendre();
}

demarrer();
</script>
</body>
</html>
