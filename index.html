<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atelier 3D">
<link rel="apple-touch-icon" href="icon.svg">
<title>Atelier Figurines 3D</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --panel2:#1c2230; --line:#283041;
    --txt:#eef2f8; --muted:#97a1b4; --accent:#b9f24d; --accent2:#7c5cff;
    --ok:#46c46a; --warn:#e89b4d; --danger:#ff6a6a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#10141d,#05060a);color:var(--txt)}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:11px;padding:15px 16px;position:sticky;top:0;z-index:5;
    background:linear-gradient(180deg,#19202c,#141821);border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b0d12;font-size:18px}
  header h1{font-size:15.5px;margin:0;font-weight:650}
  header .sub{font-size:11px;color:var(--muted)}
  .refresh{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
  main{flex:1;padding:14px 14px 90px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;
    background:linear-gradient(0deg,#12161f,#141821f2);border-top:1px solid var(--line)}
  .navin{display:flex;width:100%;max-width:480px}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px calc(10px + env(safe-area-inset-bottom));
    font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .ico{font-size:19px}
  nav button.on{color:var(--accent)}
  h2{font-size:14px;margin:4px 2px 12px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}
  .fig{display:flex;gap:11px}
  .fig img{width:74px;height:74px;border-radius:12px;object-fit:cover;background:var(--panel2);flex:0 0 74px}
  .fig .noimg{width:74px;height:74px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;
    justify-content:center;font-size:26px;flex:0 0 74px}
  .fig .t{font-weight:600;font-size:13.5px;line-height:1.35}
  .fig .d{color:var(--muted);font-size:11px;margin-top:3px}
  .badge{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:20px;margin-top:6px;margin-right:5px;
    border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  .badge.b-image_en_cours,.badge.b-3d_en_cours{color:var(--warn);border-color:rgba(232,155,77,.4);background:rgba(232,155,77,.1)}
  .badge.b-image_validee,.badge.b-3d_valide,.badge.b-fichier_pret{color:var(--accent);border-color:rgba(185,242,77,.4);background:rgba(185,242,77,.08)}
  .badge.b-imprimee{color:var(--ok);border-color:rgba(70,196,106,.45);background:rgba(70,196,106,.12)}
  .badge.lic{color:var(--danger);border-color:rgba(255,106,106,.4);background:rgba(255,106,106,.08)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}
  .gcap{font-size:10.5px;color:var(--muted);margin:4px 2px 10px}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:11px 14px;border-radius:12px;
    font-size:13px;cursor:pointer;width:100%;margin-top:8px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#a6e23e);color:#0b0d12;border-color:transparent;font-weight:650}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:34px 10px;line-height:1.6}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 2px 4px}
  input[type=number],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;color:var(--txt);font-size:14px;outline:none}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .res{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}.kv b{color:var(--accent)}
  .note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
  .aide p{font-size:13.5px;line-height:1.65;color:var(--txt)}
  .aide .etape{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
  .aide .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#0b0d12;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 26px;margin-top:2px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">A</div>
    <div>
      <h1>Atelier Figurines 3D</h1>
      <div class="sub">Suivi de tes figurines, de l'idée à l'impression</div>
    </div>
    <div class="refresh" onclick="rafraichir()">↻</div>
  </header>
  <main id="main"></main>
  <nav><div class="navin">
    <button data-tab="suivi" class="on" onclick="go('suivi')"><span class="ico">🧾</span>Suivi</button>
    <button data-tab="galerie" onclick="go('galerie')"><span class="ico">🖼️</span>Galerie</button>
    <button data-tab="troisd" onclick="go('troisd')"><span class="ico">🗿</span>3D</button>
    <button data-tab="calculs" onclick="go('calculs')"><span class="ico">🧮</span>Calculs</button>
    <button data-tab="aide" onclick="go('aide')"><span class="ico">💡</span>Aide</button>
  </div></nav>
</div>

<script>
const SB_URL = 'https://bmvytqfddrfgcgokoxfn.supabase.co';
const SB_KEY = 'sb_publishable_tGwuRROW7-AjWdE8K8ZbFA_R8_V2LUU';
const main = document.getElementById('main');
let TAB = 'suivi';

async function sb(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
  if (!r.ok) throw new Error('Supabase ' + r.status);
  return r.json();
}
const STATUTS = {
  idee:'💭 Idée', image_en_cours:'🎨 Image en cours', image_validee:'✅ Image validée',
  '3d_en_cours':'🔧 Sculpture 3D…', '3d_valide':'✅ 3D validée', fichier_pret:'📦 Fichier prêt',
  imprimee:'🖨️ Imprimée', abandonnee:'🗑️ Abandonnée'
};
const esc = s => String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateFr = s => new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

function go(t){ TAB=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }
function rafraichir(){ render(true); }

async function render(){
  if (TAB==='suivi') return vueSuivi();
  if (TAB==='galerie') return vueGalerie();
  if (TAB==='troisd') return vue3D();
  if (TAB==='calculs') return vueCalculs();
  return vueAide();
}

async function vueSuivi(){
  main.innerHTML = '<h2>Mes figurines</h2><div class="empty">Chargement…</div>';
  try{
    const figs = await sb('atelier_figurines?order=maj_le.desc&limit=50');
    if(!figs.length){ main.innerHTML = '<h2>Mes figurines</h2><div class="empty">Aucune figurine pour l\'instant.<br>Envoie ton idée au bot Telegram pour démarrer ! 🚀</div>'; return; }
    main.innerHTML = '<h2>Mes figurines</h2>' + figs.map(f => `
      <div class="card"><div class="fig">
        ${f.image_url ? `<img src="${esc(f.image_url)}" loading="lazy">` : '<div class="noimg">🧸</div>'}
        <div style="flex:1">
          <div class="t">${esc(f.demande)}</div>
          <div class="d">#${f.id} · ${dateFr(f.cree_le)}${f.cout_total_eur ? ' · coût réel ' + Number(f.cout_total_eur).toFixed(2) + ' €' : ''}</div>
          <span class="badge b-${esc(f.statut)}">${STATUTS[f.statut]||esc(f.statut)}</span>
          ${f.licence ? '<span class="badge lic">⚠️ licence — vente interdite</span>' : ''}
          ${f.usage==='vente' ? '<span class="badge">🏷️ vente</span>' : ''}
        </div>
      </div>
      ${f.model_url ? `<button class="btn" onclick="location.href='viewer.html?src='+encodeURIComponent('${esc(f.model_url)}')">🗿 Voir la 3D</button>` : ''}
      </div>`).join('');
  }catch(e){ main.innerHTML = '<h2>Mes figurines</h2><div class="empty">Impossible de charger 😕<br>' + esc(e.message) + '</div>'; }
}

async function vueGalerie(){
  main.innerHTML = '<h2>Galerie des images</h2><div class="empty">Chargement…</div>';
  try{
    const it = await sb('atelier_iterations?etape=eq.image&resultat_url=not.is.null&order=id.desc&limit=60');
    if(!it.length){ main.innerHTML = '<h2>Galerie des images</h2><div class="empty">Encore rien à montrer — les images créées avec le bot apparaîtront ici.</div>'; return; }
    main.innerHTML = '<h2>Galerie des images</h2><div class="grid">' + it.map(i => `
      <div><a href="${esc(i.resultat_url)}" target="_blank" rel="noopener"><img src="${esc(i.resultat_url)}" loading="lazy"></a>
      <div class="gcap">Figurine #${i.figurine_id} · v${i.version}${i.valide?' · ✅ validée':''}</div></div>`).join('') + '</div>';
  }catch(e){ main.innerHTML = '<h2>Galerie</h2><div class="empty">Impossible de charger 😕<br>' + esc(e.message) + '</div>'; }
}

async function vue3D(){
  main.innerHTML = '<h2>Figurines en 3D</h2><div class="empty">Chargement…</div>';
  try{
    const figs = await sb('atelier_figurines?model_url=not.is.null&order=maj_le.desc&limit=30');
    if(!figs.length){ main.innerHTML = '<h2>Figurines en 3D</h2><div class="empty">Pas encore de 3D — dès qu\'une image est validée, la sculpture apparaît ici.</div>'; return; }
    main.innerHTML = '<h2>Figurines en 3D</h2>' + figs.map(f => `
      <div class="card">
        <div class="fig">${f.image_url?`<img src="${esc(f.image_url)}" loading="lazy">`:'<div class="noimg">🗿</div>'}
        <div style="flex:1"><div class="t">${esc(f.demande)}</div>
        <span class="badge b-${esc(f.statut)}">${STATUTS[f.statut]||esc(f.statut)}</span></div></div>
        <button class="btn primary" onclick="location.href='viewer.html?src='+encodeURIComponent('${esc(f.model_url)}')">🗿 Ouvrir la visionneuse 3D</button>
      </div>`).join('');
  }catch(e){ main.innerHTML = '<h2>3D</h2><div class="empty">Impossible de charger 😕<br>' + esc(e.message) + '</div>'; }
}

function vueCalculs(){
  main.innerHTML = `
  <h2>Remplissage du plateau (P2S · 256×256)</h2>
  <div class="card">
    <div class="row2">
      <div><label>Largeur figurine (mm)</label><input type="number" id="px" value="80"></div>
      <div><label>Profondeur (mm)</label><input type="number" id="py" value="80"></div>
    </div>
    <label>Espace entre pièces (mm)</label><input type="number" id="pm" value="10">
    <button class="btn primary" onclick="calcPlateau()">Calculer</button>
    <div class="res" id="resPlateau" style="display:none"></div>
    <div class="note">Rappel : on n'attend JAMAIS un plateau plein pour lancer — c'est juste pour savoir s'il reste de la place.</div>
  </div>
  <h2>Coût d'une impression</h2>
  <div class="card">
    <div class="row2">
      <div><label>Poids (g)</label><input type="number" id="cg" value="85"></div>
      <div><label>Prix bobine (€/kg)</label><input type="number" id="ck" value="20"></div>
    </div>
    <div class="row2">
      <div><label>Temps (heures)</label><input type="number" id="ch" value="6.5" step="0.5"></div>
      <div><label>Puissance moy. (W)</label><input type="number" id="cw" value="100"></div>
    </div>
    <label>Prix du kWh (€)</label><input type="number" id="ce" value="0.2016" step="0.001">
    <button class="btn primary" onclick="calcCout()">Calculer</button>
    <div class="res" id="resCout" style="display:none"></div>
    <div class="note">Pour la VENTE : jamais à perte — prix conseillé = coût total × 3 minimum (matière + énergie + usure + ton temps).</div>
  </div>`;
}
function calcPlateau(){
  const x=+px.value, y=+py.value, m=+pm.value, BED=256;
  const nx=Math.floor((BED+m)/(x+m)), ny=Math.floor((BED+m)/(y+m));
  const n=Math.max(0,nx*ny);
  const el=document.getElementById('resPlateau'); el.style.display='block';
  el.innerHTML = n===0 ? 'Trop grand pour le plateau 😅 (max 256×256 mm)' :
    `<div class="kv"><span>Figurines par plateau</span><b>${n}</b></div>
     <div class="kv"><span>Disposition</span><b>${nx} × ${ny}</b></div>
     <div class="kv"><span>Place perdue</span><b>${Math.round(100-(n*x*y)/(BED*BED)*100)} %</b></div>`;
}
function calcCout(){
  const g=+cg.value, k=+ck.value, h=+ch.value, w=+cw.value, e=+ce.value;
  const mat=g/1000*k, ener=h*w/1000*e, usure=(mat+ener)*0.10, tot=mat+ener+usure;
  const el=document.getElementById('resCout'); el.style.display='block';
  el.innerHTML = `
    <div class="kv"><span>Matière (PLA)</span><b>${mat.toFixed(2)} €</b></div>
    <div class="kv"><span>Électricité</span><b>${ener.toFixed(2)} €</b></div>
    <div class="kv"><span>Usure machine (~10 %)</span><b>${usure.toFixed(2)} €</b></div>
    <div class="kv"><span>Coût total</span><b>${tot.toFixed(2)} €</b></div>
    <div class="kv"><span>Prix de vente conseillé (×3)</span><b>${(tot*3).toFixed(2)} € min.</b></div>`;
}

function vueAide(){
  main.innerHTML = `
  <h2>Comment ça marche</h2>
  <div class="card aide">
    <div class="etape"><div class="n">1</div><p>Tu envoies ton idée de figurine au <b>bot Telegram</b> (une phrase suffit).</p></div>
    <div class="etape"><div class="n">2</div><p>L'IA te propose une <b>image</b>. Tu critiques, elle corrige — autant de fois qu'il faut. On ne passe à la suite que quand TU valides.</p></div>
    <div class="etape"><div class="n">3</div><p>L'image validée est <b>sculptée en 3D</b> (Meshy). Même principe : tu regardes, tu critiques, tu valides.</p></div>
    <div class="etape"><div class="n">4</div><p>Franck prépare le <b>fichier d'impression .3mf</b> (réglages P2S inclus) et te l'envoie. Tu n'as plus qu'à imprimer ! 🖨️</p></div>
  </div>
  <div class="card aide">
    <p><b>⚠️ Personnages sous licence</b> (Marvel, Pokémon, Disney…) : autorisés pour TOI (usage perso), mais <b>interdits à la vente</b>. Le bot te le rappelle automatiquement.</p>
    <p><b>🧪 Comparer les générateurs d'images</b> : <a href="comparatif.html">ouvrir le banc d'essai</a>.</p>
  </div>`;
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
